<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <script>
        (function() {
            const currentTheme = localStorage.getItem("theme") || "dark";
            document.documentElement.setAttribute("data-theme", currentTheme);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnifyEd - Forgot Password</title>
    <meta name="description" content="Recover your UnifyEd ERP password. Enter your username or email, Student ID, and role.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main Style Sheet -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page-body">

    <!-- Auth Page Background Layer -->
    <div class="auth-bg-glows">
        <div class="glow-sphere g-1"></div>
        <div class="glow-sphere g-2"></div>
    </div>

    <!-- Theme toggle floating header -->
    <header class="auth-floating-header">
        <a href="login.html" class="back-home-link">
            <i class="fa-solid fa-arrow-left-long"></i> Back to Login
        </a>
        <button class="theme-toggle-btn" id="themeToggleBtn" title="Toggle Theme">
            <i class="fa-solid fa-sun icon-sun"></i>
            <i class="fa-solid fa-moon icon-moon"></i>
        </button>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card glassmorphism">
            <!-- Brand Head -->
            <div class="auth-brand">
                <i class="fa-solid fa-key auth-logo-icon"></i>
                <h2>UnifyEd</h2>
                <span class="auth-subtitle">FORGOT ERP PASSWORD</span>
            </div>

            <!-- Form -->
            <form id="forgotPasswordForm" onsubmit="handleResetSubmit(event)">
                
                <!-- Email / Username -->
                <div class="form-group">
                    <label for="resetUser">Username or Email ID</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user input-icon"></i>
                        <input type="text" id="resetUser" class="form-input" placeholder="Enter username or email address" required>
                    </div>
                </div>

                <!-- Student ID / Faculty ID -->
                <div class="form-group">
                    <label for="resetStudentId">Student ID / Employee ID</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-id-card input-icon"></i>
                        <input type="text" id="resetStudentId" class="form-input" placeholder="e.g. UEMJ-2026-1024" required>
                    </div>
                </div>

                <!-- Role Selection -->
                <div class="form-group">
                    <label for="resetRole">Select Role</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-circle-user input-icon"></i>
                        <select id="resetRole" class="form-input select-input" required>
                            <option value="" disabled selected>Select Role</option>
                            <option value="student">Student</option>
                            <option value="professor">Professor</option>
                            <option value="hod">HOD</option>
                            <option value="vc">VC</option>
                            <option value="admin">Admin</option>
                            <option value="fees-manager">Fees Manager</option>
                        </select>
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn btn-primary btn-full btn-large" id="resetSubmitBtn">
                    <i class="fa-solid fa-paper-plane"></i> Send Reset Link
                </button>

                <!-- Feedback -->
                <div id="resetFeedback" class="form-feedback"></div>
            </form>

            <div class="auth-divider">
                <div class="line"></div>
                <span>Need support?</span>
                <div class="line"></div>
            </div>

            <!-- Redirect link -->
            <div class="auth-redirect">
                <p>Contact the UEM IT Helpdesk if you have lost access to your registered details.</p>
                <a href="../index.html#contact" class="btn btn-secondary btn-full">
                    <i class="fa-solid fa-envelope"></i> Contact IT Helpdesk
                </a>
            </div>
        </div>
    </main>

    <!-- JS Helper for Theme & recovery -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Theme Toggle Logic
            const themeToggleBtn = document.getElementById("themeToggleBtn");
            const currentTheme = localStorage.getItem("theme") || "dark";
            document.documentElement.setAttribute("data-theme", currentTheme);

            themeToggleBtn.addEventListener("click", () => {
                const activeTheme = document.documentElement.getAttribute("data-theme");
                const newTheme = activeTheme === "dark" ? "light" : "dark";
                document.documentElement.setAttribute("data-theme", newTheme);
                localStorage.setItem("theme", newTheme);
            });
        });

        // Form Submit Simulation
        function handleResetSubmit(event) {
            event.preventDefault();
            const feedback = document.getElementById("resetFeedback");
            const submitBtn = document.getElementById("resetSubmitBtn");

            const username = document.getElementById("resetUser").value;
            const studentId = document.getElementById("resetStudentId").value;
            const role = document.getElementById("resetRole").value;

            if (!username || !studentId || !role) {
                feedback.style.color = "#ef4444";
                feedback.textContent = "Please fill in all recovery details.";
                return;
            }

            submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Dispatched code...';
            submitBtn.disabled = true;

            setTimeout(() => {
                feedback.style.color = "#10b981";
                
                feedback.innerHTML = `
                    <div style="background-color: rgba(16, 185, 129, 0.15); border: 1px solid var(--primary); padding: 16px; border-radius: var(--border-radius-sm); margin-top: 15px; text-align: left;">
                        <strong style="display:block; margin-bottom: 4px; color:#10b981;">Instructions Dispatched!</strong>
                        <span style="font-size: 13px; color: var(--text-secondary);">We have sent a secure password reset link to your registered email address for student ID: <code>${studentId.toUpperCase()}</code>.</span>
                        <p style="font-size: 11px; margin-top: 8px; color: var(--text-tertiary);">Please check your spam/junk folder if you do not receive it in 2 minutes.</p>
                        <a href="login.html" class="btn btn-primary btn-full" style="margin-top: 15px; font-size: 13px; padding: 8px 12px; height: auto;">Back to Login</a>
                    </div>
                `;
                submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> Reset Email Sent';
            }, 1500);
        }
    </script>
</body>
</html>
