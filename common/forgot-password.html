<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - EduHub</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="light-mode login-page">
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <i class="fas fa-graduation-cap"></i>
                <span>EduHub</span>
            </div>
            <div class="nav-actions">
                <a href="index.html" class="btn btn-secondary">Back Home</a>
            </div>
        </div>
    </nav>

    <div class="login-container">
        <div class="login-left">
            <h1>Reset Your Password</h1>
            <p>Enter the email associated with your account and we'll send a password reset link.</p>
        </div>

        <div class="login-right">
            <h2>Forgot Password</h2>
            <p>We'll send instructions to your email to reset the password.</p>

            <form id="forgotForm">
                <div class="form-group">
                    <label for="fp-email">Email Address</label>
                    <input type="email" id="fp-email" placeholder="you@college.edu" required>
                </div>

                <button type="submit" class="btn-login">Send Reset Link</button>
            </form>

            <div style="margin-top:18px;">
                <a href="login.html" class="btn btn-secondary">Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        const forgotForm = document.getElementById('forgotForm');
        if (forgotForm) {
            forgotForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const email = document.getElementById('fp-email').value.trim();
                if (!email) {
                    alert('Please enter your email');
                    return;
                }
                alert('Password reset link sent to ' + email);
                setTimeout(() => { window.location.href = 'login.html'; }, 1200);
            });
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
